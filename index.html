<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <title>Animation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0ebeb;
        }

        .canvas-wrapper {
            margin-top: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100vw;
            position: fixed;
            inset: 0;
            z-index: 1;
            height: 100vh;
            /* Полупрозрачная графитовая рамка */
            /* border: 1px solid rgba(50, 50, 50, 0.5); */

            /* Внутренние и внешние тени */
            /* box-shadow: */
            /* 0 4px 10px rgba(0, 0, 0, 0.3), */
            /* внешняя тень */
            /* inset 0 0 8px rgba(50, 50, 50, 0.2); */
            /* внутренняя мягкая подсветка */

            /* border-radius: 12px; */
            /* скруглённые углы */
        }

        /* контейнер меню */
        .top-overlay {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* ручка */
        .overlay-handle {
            width: 120px;
            height: 6px;
            margin: 6px auto 0;
            background: rgba(26, 25, 25, 0.25);
            border-radius: 999px;
            backdrop-filter: blur(6px);
            transition:
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        /* меню */
        .overlay-menu {
            margin-top: 6px;
            padding: 14px;
            background: rgba(40, 40, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        /* показать при наведении */
        .top-overlay:hover .overlay-menu {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .controls {
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
            margin-top: 10px;
            gap: 20px;
        }

        .control-buttons {
            display: flex;
        }

        .control-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            margin: 6px;
            background: #f5f5f5;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-button:hover {
            background: #e0e0e0;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .control-button svg {
            width: 30px;
            height: 30px;
        }

        .form-range {
            width: 300px;
        }

        #horizontal {
            svg {
                transform: rotate(-90deg)
            }
        }
    </style>
</head>

<body>
    <div class="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>

    <div class="top-overlay">

        <div class="overlay-handle">
        </div>
        <div class="overlay-menu">
            <div class="controls">
                <div class="control-buttons">
                    <div class="control-button" id="horizontal">
                        <svg fill="#000000" width="800px" height="800px" viewBox="0 0 256 256"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M100.218 80.292c-2.205 0-2.746-1.292-1.214-2.883L128 47.313l29.24 30.11c1.538 1.585 1 2.87-1.209 2.87h-19.239l.636 95.811h18.596c2.21 0 2.746 1.28 1.201 2.854L128 208.746l-28.982-29.773c-1.542-1.584-1.004-2.869 1.2-2.869h19.54V80.292h-19.54z"
                                fill-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="control-button" id="vertical">
                        <svg fill="#000000" width="800px" height="800px" viewBox="0 0 256 256"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M100.218 80.292c-2.205 0-2.746-1.292-1.214-2.883L128 47.313l29.24 30.11c1.538 1.585 1 2.87-1.209 2.87h-19.239l.636 95.811h18.596c2.21 0 2.746 1.28 1.201 2.854L128 208.746l-28.982-29.773c-1.542-1.584-1.004-2.869 1.2-2.869h19.54V80.292h-19.54z"
                                fill-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="control-button" id="diag1">
                        <svg fill="#000000" width="800px" height="800px" viewBox="-9 0 32 32" version="1.1"
                            xmlns="http://www.w3.org/2000/svg">
                            <title>arrows-oblique</title>
                            <path
                                d="M14.48 22.48v-3.2c0-0.48-0.36-0.84-0.84-0.84v0c-0.48 0-0.84 0.36-0.84 0.84v1.12l-10-10h1.16c0.48 0 0.84-0.36 0.84-0.84s-0.36-0.84-0.84-0.84h-3.16c-0.52 0-0.8 0.32-0.8 0.84v3.16c0 0.48 0.36 0.84 0.84 0.84v0c0.48 0 0.84-0.36 0.84-0.84v-1.12l10 10h-1.12c-0.48 0-0.84 0.36-0.84 0.84s0.36 0.84 0.84 0.84h3.16c0.56 0 0.76-0.24 0.76-0.8z">
                            </path>
                        </svg>
                    </div>
                    <div class="control-button" id="diag2">
                        <svg fill="#000000" width="800px" height="800px" viewBox="-8.5 0 32 32" version="1.1"
                            xmlns="http://www.w3.org/2000/svg">
                            <title>arrows-oblique-alt</title>
                            <path
                                d="M14.56 9.6c0-0.48-0.32-0.84-0.88-0.84v0h-3.16c-0.48 0-0.84 0.36-0.84 0.84s0.36 0.84 0.84 0.84h1.12l-10 10v-1.12c0-0.48-0.36-0.84-0.84-0.84-0.44 0-0.8 0.36-0.8 0.84v3.16c0 0.44 0.28 0.8 0.84 0.8h3.16c0.48 0 0.84-0.36 0.84-0.84s-0.36-0.84-0.84-0.84h-1.12l10-10v1.12c0 0.48 0.36 0.84 0.84 0.84s0.84-0.36 0.84-0.84v-3.12z">
                            </path>
                        </svg>
                    </div>
                    <div class="control-button" id="eight">
                        <svg width="800px" height="800px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <title>infinity</title>
                            <rect width="24" height="24" fill="none" />
                            <path
                                d="M18.6,6.62a5.38,5.38,0,1,1-3.82,9.18L12,13.34,9.17,15.85A5.33,5.33,0,0,1,5.4,17.38,5.38,5.38,0,1,1,9.22,8.2L12,10.66l2.83-2.51A5.33,5.33,0,0,1,18.6,6.62M7.8,14.39,10.5,12,7.84,9.65A3.39,3.39,0,1,0,5.4,15.38a3.36,3.36,0,0,0,2.4-1m8.4-4.78L13.5,12l2.66,2.35A3.39,3.39,0,1,0,18.6,8.62,3.36,3.36,0,0,0,16.2,9.61Z" />
                        </svg>
                    </div>
                </div>
                <div class="speed-control">

                    <label for="speed" class="form-label"></label>
                    <input type="range" class="form-range" min="2" max="20" step="1" id="speed">
                </div>
                <div class="mt-3">
                    <div class="btn-group flex-wrap" role="group" aria-label="Sound pad">
                        <button type="button" class="btn btn-outline-light active" data-sound="-1">🔇</button>
                        <button type="button" class="btn btn-outline-light" data-sound="0">1</button>
                        <button type="button" class="btn btn-outline-light" data-sound="1">2</button>
                        <button type="button" class="btn btn-outline-light" data-sound="2">3</button>
                        <button type="button" class="btn btn-outline-light" data-sound="3">4</button>
                        <button type="button" class="btn btn-outline-light" data-sound="4">5</button>
                        <button type="button" class="btn btn-outline-light" data-sound="5">6</button>
                        <button type="button" class="btn btn-outline-light" data-sound="6">7</button>
                        <button type="button" class="btn btn-outline-light" data-sound="7">8</button>
                    </div>
                </div>

            </div>
        </div>

    </div>
    <script>
        //audio

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let hitBuffer;

        fetch("classics.mp3")
            .then(r => r.arrayBuffer())
            .then(b => audioCtx.decodeAudioData(b))
            .then(buf => hitBuffer = buf);

        function playFrom(time, duration = 0.2, pan = 0) {
            if (!hitBuffer) return;

            const source = audioCtx.createBufferSource();
            source.buffer = hitBuffer;

            const panNode = audioCtx.createStereoPanner();
            panNode.pan.value = pan;

            source.connect(panNode).connect(audioCtx.destination);

            // start(when, offset, duration)
            source.start(0, time, duration);
        }
        const sounds = [
            { time: 0, dur: 1 },
            { time: 2, dur: 1 },
            { time: 4, dur: 1 },
            { time: 6, dur: 1 },
            { time: 8, dur: 1 },
            { time: 10, dur: 1 },
            { time: 12, dur: 1 },
            { time: 14, dur: 1 }
        ];

        let currentSound = -1;

        document.querySelectorAll('[data-sound]').forEach(btn => {
            btn.addEventListener('click', () => {
                document
                    .querySelectorAll('[data-sound]')
                    .forEach(b => b.classList.remove('active'));

                btn.classList.add('active');
                currentSound = Number(btn.dataset.sound);

                // предпрослушивание
                playFrom(sounds[currentSound].time, sounds[currentSound].dur, 0);
            });
        });

        function playWallHit(side) {
            const snd = sounds[currentSound];
            if (!snd) return;

            let pan = 0;
            if (side === "left") pan = -1;
            if (side === "right") pan = 1;

            playFrom(snd.time, snd.dur, pan);
        }



        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = canvas.clientWidth
        canvas.height = canvas.clientHeight
        const ball = {
            x: 0,
            y: 0,
            r: 80
        };

        // -------- СОСТОЯНИЕ --------
        let mode = "horizontal";
        let speed = 10;

        // для прямых
        let dir = 1;

        // для диагонали
        let t = 0;
        let tDir = 1;
        let start = { x: 0, y: 0 };
        let end = { x: 0, y: 0 };

        // для восьмёрки
        let time = 0;

        // -------- РЕЖИМЫ --------

        function setHorizontal() {
            mode = "horizontal";
            ball.x = ball.r;
            ball.y = canvas.height / 2;
            dir = 1;
        }

        function setVertical() {
            mode = "vertical";
            ball.x = canvas.width / 2;
            ball.y = ball.r;
            dir = 1;
        }

        function setDiagonalLeftTop() {
            mode = "diagonal";
            t = 0;
            tDir = 1;

            start = { x: ball.r, y: ball.r };
            end = {
                x: canvas.width - ball.r,
                y: canvas.height - ball.r
            };
        }

        function setDiagonalRightTop() {
            mode = "diagonal";
            t = 0;
            tDir = 1;

            start = { x: canvas.width - ball.r, y: ball.r };
            end = {
                x: ball.r,
                y: canvas.height - ball.r
            };
        }

        function setEight() {
            mode = "eight";
            time = 0;
        }

        // -------- АНИМАЦИЯ --------

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (mode === "horizontal") {
                ball.x += speed * dir;
                if (ball.x + ball.r >= canvas.width && dir > 0) {
                    dir = -1;
                    playWallHit("right");
                }

                if (ball.x - ball.r <= 0 && dir < 0) {
                    dir = 1;
                    playWallHit("left");
                }
            }

            if (mode === "vertical") {
                ball.y += speed * dir;
                if (ball.y + ball.r >= canvas.height && dir > 0) {
                    dir = -1;
                    playWallHit("bottom");
                }

                if (ball.y - ball.r <= 0 && dir < 0) {
                    dir = 1;
                    playWallHit("top");
                }
            }

            if (mode === "diagonal") {
                t += (speed / 1000) * tDir;

                // пересчитываем текущие координаты
                ball.x = start.x + (end.x - start.x) * t;
                ball.y = start.y + (end.y - start.y) * t;

                // проверка удара по "стенкам"
                let hit = false;
                let pan = 0;

                if (t >= 1 && tDir > 0) {
                    tDir *= -1; // меняем направление
                    hit = true;
                    pan = (end.x > start.x) ? 1 : -1; // движемся вправо = правое ухо
                } else if (t <= 0 && tDir < 0) {
                    tDir *= -1;
                    hit = true;
                    pan = (end.x > start.x) ? -1 : 1; // движемся влево = левое ухо
                }

                if (hit) {
                    // проигрываем выбранный звук
                    const snd = sounds[currentSound];
                    if (snd) playFrom(snd.time, snd.dur, pan);
                }
            }


            if (mode === "eight") {
                time += speed * 0.0035;

                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const a = canvas.width / 2 - ball.r;
                const b = canvas.height / 2 - ball.r;

                // лемниската
                ball.x = cx + a * Math.sin(time);
                ball.y = cy + b * Math.sin(time) * Math.cos(time);



                // if (mode === "eight") {
                //     time += speed * 0.0035;

                //     const cx = canvas.width / 2;
                //     const cy = canvas.height / 2;
                //     const a = canvas.width / 2 - ball.r;
                //     const b = canvas.height / 2 - ball.r;

                //     const prevX = ball.x;

                //     ball.x = cx + a * Math.sin(time);
                //     ball.y = cy + b * Math.sin(time) * Math.cos(time);

                //     // пересечение центра — лёгкий клик
                //     if ((prevX < cx && ball.x >= cx) || (prevX > cx && ball.x <= cx)) {
                //         playFrom(4.0, 0.12, 0);
                //     }
                // }

            }

            // шарик
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = "red";
            ctx.fill();

            requestAnimationFrame(animate);
        }

        // -------- КОНТРОЛЛЫ --------

        document.getElementById("horizontal").onclick = setHorizontal;
        document.getElementById("vertical").onclick = setVertical;
        document.getElementById("diag1").onclick = setDiagonalLeftTop;
        document.getElementById("diag2").onclick = setDiagonalRightTop;
        document.getElementById("eight").onclick = setEight;

        document.getElementById("speed").oninput = (e) => {
            speed = Number(e.target.value);
        };

        // старт
        setHorizontal();
        animate();

    </script>
</body>

</html>
