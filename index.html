<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <title>EMDR Helper</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0ebeb;
        }

        .canvas-wrapper {
            margin-top: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100vw;
            position: fixed;
            inset: 0;
            z-index: 1;
            height: 100vh;
        }

        /* контейнер меню сверху */
        .top-overlay {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* ручка сверху */
        .overlay-handle {
            width: 120px;
            height: 6px;
            margin: 6px auto 0;
            background: rgba(26, 25, 25, 0.25);
            border-radius: 999px;
            backdrop-filter: blur(6px);
            transition:
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        /* меню сверху */
        .overlay-menu {
            margin-top: 6px;
            padding: 14px;
            background: rgba(40, 40, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        /* показать при наведении сверху */
        .top-overlay:hover .overlay-menu {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* контейнер меню снизу */
        .bottom-overlay {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* ручка снизу */
        .bottom-overlay .overlay-handle {
            width: 120px;
            height: 6px;
            margin: 0 auto 6px;
            background: rgba(26, 25, 25, 0.25);
            border-radius: 999px;
            backdrop-filter: blur(6px);
            transition:
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        /* меню снизу */
        .bottom-overlay .overlay-menu {
            margin-bottom: 6px;
            padding: 14px;
            background: rgba(40, 40, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        /* показать при наведении снизу */
        .bottom-overlay:hover .overlay-menu {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .controls {
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
            margin-top: 10px;
            gap: 20px;
        }

        .control-buttons {
            display: flex;
        }

        .control-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            margin: 6px;
            background: #f5f5f5;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-button:hover {
            background: #e0e0e0;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .control-button svg {
            width: 30px;
            height: 30px;
        }

        .form-range {
            width: 300px;
        }

        #horizontal {
            svg {
                transform: rotate(-90deg)
            }
        }

        /* контейнер */
        #colorBtn {
            position: relative;
        }

        /* визуальный квадрат */
        .color-preview {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #ff0000;
            pointer-events: none;
        }

        /* 🔥 ПОЛНОЕ ПЕРЕОПРЕДЕЛЕНИЕ bootstrap */
        #colorBtn input[type="color"] {
            all: unset;

            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            cursor: pointer;
            opacity: 0;

            -webkit-appearance: none;
            appearance: none;
        }


        .sound-pad {
            display: grid;
            grid-template-columns: repeat(9, 44px);
            gap: 7px;
            margin-top: 12px;
        }

        .sound-pad:first-child {
            margin-top: 0;
        }

        .pad {
            width: 44px;
            height: 44px;
            border-radius: 10px;

            background: rgba(60, 60, 60, 0.65);
            backdrop-filter: blur(6px);

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ddd;
            font-size: 14px;
            font-weight: 500;

            cursor: pointer;
            user-select: none;

            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.05),
                0 4px 10px rgba(0, 0, 0, 0.4);

            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease,
                background 0.12s ease;
        }

        .pad:hover {
            background: rgba(80, 80, 80, 0.8);
            transform: translateY(-1px);
        }

        .pad:active {
            transform: translateY(1px);
            box-shadow:
                inset 0 4px 8px rgba(0, 0, 0, 0.6);
        }

        .pad.active {
            background: rgba(120, 120, 120, 0.9);
            color: #fff;

            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.2),
                0 0 16px rgba(255, 255, 255, 0.15);
        }

        .sound-controls {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
    </style>
</head>

<body>
    <div class="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>

    <!-- Верхний оверлей с управлением движением -->
    <div class="top-overlay">

                            </path>
                        </svg>
                    </div>
                    <div class="control-button" id="diag2">
                        <svg fill="#000000" width="800px" height="800px" viewBox="-8.5 0 32 32" version="1.1"
                            xmlns="http://www.w3.org/2000/svg">
                            <title>arrows-oblique-alt</title>
                            <path
                                d="M14.56 9.6c0-0.48-0.32-0.84-0.88-0.84v0h-3.16c-0.48 0-0.84 0.36-0.84 0.84s0.36 0.84 0.84 0.84h1.12l-10 10v-1.12c0-0.48-0.36-0.84-0.84-0.84-0.44 0-0.8 0.36-0.8 0.84v3.16c0 0.44 0.28 0.8 0.84 0.8h3.16c0.48 0 0.84-0.36 0.84-0.84s-0.36-0.84-0.84-0.84h-1.12l10-10v1.12c0 0.48 0.36 0.84 0.84 0.84s0.84-0.36 0.84-0.84v-3.12z">
                            </path>
                        </svg>
                    </div>
                    <div class="control-button" id="eight">
                        <svg width="800px" height="800px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <title>infinity</title>
                            <rect width="24" height="24" fill="none" />
                            <path
                                d="M18.6,6.62a5.38,5.38,0,1,1-3.82,9.18L12,13.34,9.17,15.85A5.33,5.33,0,0,1,5.4,17.38,5.38,5.38,0,1,1,9.22,8.2L12,10.66l2.83-2.51A5.33,5.33,0,0,1,18.6,6.62M7.8,14.39,10.5,12,7.84,9.65A3.39,3.39,0,1,0,5.4,15.38a3.36,3.36,0,0,0,2.4-1m8.4-4.78L13.5,12l2.66,2.35A3.39,3.39,0,1,0,18.6,8.62,3.36,3.36,0,0,0,16.2,9.61Z" />
                        </svg>
                    </div>
                </div>
                <div class="speed-control">
                    <label for="speed" class="form-label"></label>
                    <input type="range" class="form-range" min="5" max="45" step="1" id="speed" value="25">
                </div>
                <div class="control-button" id="colorBtn">
                    <div class="color-preview" id="colorPreview"></div>
                    <input type="color" id="ballColor" value="#ff0000">
                </div>
            </div>
        </div>
    </div>

    <!-- Нижний оверлей со звуками -->
    <div class="bottom-overlay">
        <div class="overlay-menu">
            <div class="sound-controls">
                <div class="sound-pad">
                    <div class="pad active" data-file="0" data-sound="-1">
<svg width="800px" height="800px" viewBox="-4 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

</svg>
                    </div>
                </div>
                <div class="sound-pad">
                    <div class="pad" data-file="0" data-sound="0">1</div>
                    <div class="pad" data-file="0" data-sound="1">2</div>

                    <div class="pad" data-file="0" data-sound="4">5</div>

                    <div class="pad" data-file="0" data-sound="7">8</div>
                </div>
                <div class="sound-pad">
                    <div class="pad" data-file="1" data-sound="0">1</div>

                <div class="sound-pad">
                    <div class="pad" data-file="2" data-sound="0">1</div>

        <div class="overlay-handle"></div>

    <script src="script.js"></script>
