<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <title>EMDR Helper</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f0ebeb;
        }

        .canvas-wrapper {
            margin-top: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100vw;
            position: fixed;
            inset: 0;
            z-index: 1;
            height: 100vh;
            /* Полупрозрачная графитовая рамка */
            /* border: 1px solid rgba(50, 50, 50, 0.5); */

            /* Внутренние и внешние тени */
            /* box-shadow: */
            /* 0 4px 10px rgba(0, 0, 0, 0.3), */
            /* внешняя тень */
            /* inset 0 0 8px rgba(50, 50, 50, 0.2); */
            /* внутренняя мягкая подсветка */

            /* border-radius: 12px; */
            /* скруглённые углы */
        }

        /* контейнер меню */
        .top-overlay {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        /* ручка */
        .overlay-handle {
            width: 120px;
            height: 6px;
            margin: 6px auto 0;
            background: rgba(26, 25, 25, 0.25);
            border-radius: 999px;
            backdrop-filter: blur(6px);
            transition:
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        /* меню */
        .overlay-menu {
            margin-top: 6px;
            padding: 14px;
            background: rgba(40, 40, 40, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        /* показать при наведении */
        .top-overlay:hover .overlay-menu {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .controls {
            align-items: center;
            justify-content: center;
            display: flex;
            flex-direction: column;
            margin-top: 10px;
            gap: 20px;
        }

        .control-buttons {
            display: flex;
        }

        .control-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            margin: 6px;
            background: #f5f5f5;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-button:hover {
            background: #e0e0e0;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .control-button svg {
            width: 30px;
            height: 30px;
        }

        .form-range {
            width: 300px;
        }

        #horizontal {
            svg {
                transform: rotate(-90deg)
            }
        }

        /* контейнер */
        #colorBtn {
            position: relative;
        }

        /* визуальный квадрат */
        .color-preview {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: #ff0000;
            pointer-events: none;
        }

        /* 🔥 ПОЛНОЕ ПЕРЕОПРЕДЕЛЕНИЕ bootstrap */
        #colorBtn input[type="color"] {
            all: unset;

            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            cursor: pointer;
            opacity: 0;

            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>

<body>
    <div class="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>

    <div class="top-overlay">

        <div class="overlay-handle">
        </div>
        <div class="overlay-menu">
            <div class="controls">
                <div class="control-buttons">
                    <div class="control-button" id="stop">
                        <svg width="800px" height="800px" viewBox="0 0 24 24" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M4 18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12z"
                                fill="#000000" />
                        </svg>
                    </div>

                    <div class="control-button" id="horizontal">
                        <svg fill="#000000" width="800px" height="800px" viewBox="0 0 256 256"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M100.218 80.292c-2.205 0-2.746-1.292-1.214-2.883L128 47.313l29.24 30.11c1.538 1.585 1 2.87-1.209 2.87h-19.239l.636 95.811h18.596c2.21 0 2.746 1.28 1.201 2.854L128 208.746l-28.982-29.773c-1.542-1.584-1.004-2.869 1.2-2.869h19.54V80.292h-19.54z"
                                fill-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="control-button" id="vertical">
                        <svg fill="#000000" width="800px" height="800px" viewBox="0 0 256 256"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M100.218 80.292c-2.205 0-2.746-1.292-1.214-2.883L128 47.313l29.24 30.11c1.538 1.585 1 2.87-1.209 2.87h-19.239l.636 95.811h18.596c2.21 0 2.746 1.28 1.201 2.854L128 208.746l-28.982-29.773c-1.542-1.584-1.004-2.869 1.2-2.869h19.54V80.292h-19.54z"
                                fill-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="control-button" id="diag1">
                        <svg fill="#000000" width="800px" height="800px" viewBox="-9 0 32 32" version="1.1"
                            xmlns="http://www.w3.org/2000/svg">
                            <title>arrows-oblique</title>
                            <path
                                d="M14.48 22.48v-3.2c0-0.48-0.36-0.84-0.84-0.84v0c-0.48 0-0.84 0.36-0.84 0.84v1.12l-10-10h1.16c0.48 0 0.84-0.36 0.84-0.84s-0.36-0.84-0.84-0.84h-3.16c-0.52 0-0.8 0.32-0.8 0.84v3.16c0 0.48 0.36 0.84 0.84 0.84v0c0.48 0 0.84-0.36 0.84-0.84v-1.12l10 10h-1.12c-0.48 0-0.84 0.36-0.84 0.84s0.36 0.84 0.84 0.84h3.16c0.56 0 0.76-0.24 0.76-0.8z">
                            </path>
                        </svg>
                    </div>
                    <div class="control-button" id="diag2">
                        <svg fill="#000000" width="800px" height="800px" viewBox="-8.5 0 32 32" version="1.1"
                            xmlns="http://www.w3.org/2000/svg">
                            <title>arrows-oblique-alt</title>
                            <path
                                d="M14.56 9.6c0-0.48-0.32-0.84-0.88-0.84v0h-3.16c-0.48 0-0.84 0.36-0.84 0.84s0.36 0.84 0.84 0.84h1.12l-10 10v-1.12c0-0.48-0.36-0.84-0.84-0.84-0.44 0-0.8 0.36-0.8 0.84v3.16c0 0.44 0.28 0.8 0.84 0.8h3.16c0.48 0 0.84-0.36 0.84-0.84s-0.36-0.84-0.84-0.84h-1.12l10-10v1.12c0 0.48 0.36 0.84 0.84 0.84s0.84-0.36 0.84-0.84v-3.12z">
                            </path>
                        </svg>
                    </div>
                    <div class="control-button" id="eight">
                        <svg width="800px" height="800px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <title>infinity</title>
                            <rect width="24" height="24" fill="none" />
                            <path
                                d="M18.6,6.62a5.38,5.38,0,1,1-3.82,9.18L12,13.34,9.17,15.85A5.33,5.33,0,0,1,5.4,17.38,5.38,5.38,0,1,1,9.22,8.2L12,10.66l2.83-2.51A5.33,5.33,0,0,1,18.6,6.62M7.8,14.39,10.5,12,7.84,9.65A3.39,3.39,0,1,0,5.4,15.38a3.36,3.36,0,0,0,2.4-1m8.4-4.78L13.5,12l2.66,2.35A3.39,3.39,0,1,0,18.6,8.62,3.36,3.36,0,0,0,16.2,9.61Z" />
                        </svg>
                    </div>
                </div>
                <div class="speed-control">

                    <label for="speed" class="form-label"></label>
                    <input type="range" class="form-range" min="5" max="45" step="1" id="speed" value="25">
                </div>
                <div class="control-button" id="colorBtn">
                    <div class="color-preview" id="colorPreview"></div>
                    <input type="color" id="ballColor" value="#ff0000">
                </div>

                <div class="mt-3">
                    <div class="btn-group flex-wrap" role="group" aria-label="Sound pad">
                        <button type="button" class="btn btn-outline-light active" data-sound="-1">🔇</button>
                        <button type="button" class="btn btn-outline-light" data-sound="0">1</button>
                        <button type="button" class="btn btn-outline-light" data-sound="1">2</button>
                        <button type="button" class="btn btn-outline-light" data-sound="2">3</button>
                        <button type="button" class="btn btn-outline-light" data-sound="3">4</button>
                        <button type="button" class="btn btn-outline-light" data-sound="4">5</button>
                        <button type="button" class="btn btn-outline-light" data-sound="5">6</button>
                        <button type="button" class="btn btn-outline-light" data-sound="6">7</button>
                        <button type="button" class="btn btn-outline-light" data-sound="7">8</button>
                    </div>
                </div>

            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
